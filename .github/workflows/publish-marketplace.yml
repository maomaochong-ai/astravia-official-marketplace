name: Publish ability marketplace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      tooling: ${{ steps.tooling.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.21.1
      - run: node scripts/marketplace.mjs check
      - name: Resolve publication tool revision
        id: tooling
        run: echo "commit=$(node -p 'require("./.astravia/publish.json").toolingCommit')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: maomaochong-ai/open-astravia
          ref: ${{ steps.tooling.outputs.commit }}
          path: .tooling/open-astravia
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Build tooling源码 (plugin-vite/sdk 等包无 dist/)
        run: |
          cd .tooling/open-astravia
          bun install --frozen-lockfile 2>&1 | tail -5
          bun run build 2>&1 | tail -10
          find packages -name "dist/index.js" -maxdepth 4 2>/dev/null | head -10
      # `--strict`：自上次发布后动过**运行内容**（源码、plugin.json、locales 等）却还停在已发布版本号上的插件，
      # 在这里直接红，而不是默默发不出去。详见 scripts/static-marketplace.mjs 的 runtimeSourcesChanged。
      # 判据是路径而不是重打包摘要：依赖范围浮动，同一份源码重装会得到不同字节，比摘要会误伤。
      - name: Build unpublished versions
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add --detach "$RUNNER_TEMP/marketplace-previous" origin/gh-pages
            node scripts/marketplace.mjs build --previous "$RUNNER_TEMP/marketplace-previous" --strict
          else
            node scripts/marketplace.mjs build --strict
          fi
      - name: Check source and built package contracts
        run: node --test tests/*.test.mjs
      - name: Check compatibility before uploading
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/marketplace.mjs verify
      - uses: actions/upload-artifact@v7
        with:
          name: marketplace-candidate
          path: .marketplace-build
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.21.1
      - uses: actions/download-artifact@v8
        with:
          name: marketplace-candidate
          path: .marketplace-build
      - uses: actions/checkout@v7
        with:
          repository: maomaochong-ai/open-astravia
          ref: ${{ needs.build.outputs.tooling }}
          path: .tooling/open-astravia
          persist-credentials: false
      - name: Publish immutable packages, then advance the generated index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/publish-marketplace.mjs .marketplace-build
