<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-label="Method structure: governing principle over three tiers of methods">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c8375"/>
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">

    <rect x="50" y="20" width="460" height="58" rx="10" fill="#f3f1ea" stroke="#cfc6b4" stroke-width="1.2"/>
    <text x="280" y="44" font-size="14" font-weight="600" fill="#3a352d">Baseline disposition</text>
    <text x="280" y="64" font-size="12" fill="#6d6558">do it well · see it through</text>

    <line x1="280" y1="78" x2="280" y2="100" stroke="#8c8375" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="50" y="104" width="460" height="58" rx="10" fill="#8a1f1f" stroke="#6f1616" stroke-width="1.2"/>
    <text x="280" y="128" font-size="14" font-weight="600" fill="#ffffff">Governing principle</text>
    <text x="280" y="148" font-size="12" fill="#f2dede">seeking truth from facts</text>

    <line x1="280" y1="162" x2="280" y2="184" stroke="#8c8375" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="50" y="188" width="460" height="58" rx="10" fill="#f7e9e9" stroke="#d9b3b3" stroke-width="1.2"/>
    <text x="280" y="212" font-size="14" font-weight="600" fill="#6f1616">Tier 1 · philosophical base</text>
    <text x="280" y="232" font-size="12" fill="#5c4b4b">contradiction analysis · practice and cognition</text>

    <line x1="280" y1="246" x2="280" y2="268" stroke="#8c8375" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="50" y="272" width="460" height="58" rx="10" fill="#faf3e4" stroke="#ddc9a3" stroke-width="1.2"/>
    <text x="280" y="296" font-size="14" font-weight="600" fill="#6b5327">Tier 2 · working methods</text>
    <text x="280" y="316" font-size="12" fill="#5c5343">investigation first · mass line · criticism and self-criticism</text>

    <line x1="280" y1="330" x2="280" y2="352" stroke="#8c8375" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="50" y="356" width="460" height="58" rx="10" fill="#eef2ea" stroke="#c2cfba" stroke-width="1.2"/>
    <text x="280" y="380" font-size="14" font-weight="600" fill="#3f5236">Tier 3 · strategy and tactics</text>
    <text x="280" y="400" font-size="12" fill="#4f5a48">protracted · concentrate forces · prairie fire · overall planning</text>

    <text x="280" y="432" font-size="11" fill="#8c8375">Every tier answers to the governing principle, not the other way round.</text>
  </g>
</svg>
